<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --ink: #0E1424;
    --ink-2: #172038;
    --ink-3: #222d4b;
    --haze: #8FA3B8;
    --paper: #F3F1EC;
    --lantern: #E0402F;
    --jade: #5FB89A;
    --line: rgba(243,241,236,.12);
    --display: 'Fraunces', Georgia, serif;
    --body: 'DM Sans', system-ui, -apple-system, sans-serif;
    --han: 'Noto Serif SC', 'Songti SC', serif;
    --tabh: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  body { min-height: 100vh; padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 16px); }
  button { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  .view { display: none; }
  .view.on { display: block; }
  .wrap { padding: 0 20px; max-width: 560px; margin: 0 auto; }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: linear-gradient(180deg, #0a0f1d 0%, #16224a 70%, #2a3560 100%); padding: calc(env(safe-area-inset-top, 0px) + 36px) 0 0; }
  .moon { position: absolute; right: -30px; top: calc(env(safe-area-inset-top, 0px) + 20px); width: 150px; height: 150px; border-radius: 50%; background: var(--lantern); opacity: .9; }
  .hero .wrap { position: relative; }
  .kicker { font-size: 15px; color: var(--haze); }
  .bignum { display: flex; align-items: flex-end; gap: 10px; margin-top: 10px; }
  .days { font-family: var(--display); font-weight: 800; font-size: clamp(110px, 34vw, 170px); line-height: .85; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .han { font-family: var(--han); font-weight: 900; font-size: 52px; color: var(--lantern); line-height: 1; padding-bottom: 6px; text-shadow: 0 0 0 #000; }
  .under { margin-top: 14px; font-size: 20px; font-family: var(--display); font-weight: 600; }
  .when { margin-top: 4px; color: var(--haze); font-size: 15px; }
  .hms { display: flex; gap: 22px; margin-top: 20px; font-variant-numeric: tabular-nums; }
  .hms div { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1; }
  .hms span { display: block; font-family: var(--body); font-size: 12px; font-weight: 400; color: var(--haze); margin-top: 4px; }
  .hero.nocount .bignum, .hero.nocount .under, .hero.nocount .hms { display: none; }
  .hero.nocount .when { font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--paper); margin-top: 8px; max-width: 12em; }
  .skyline { display: block; width: 100%; height: 130px; margin-top: 16px; }

  /* Sections */
  section.blk { padding: 28px 0 4px; }
  h2 { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; }
  .sub { color: var(--haze); font-size: 14px; margin-top: 2px; }

  .clocks { margin-top: 14px; border-top: 1px solid var(--line); }
  .clock { display: grid; grid-template-columns: 1fr auto; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .clock .place { font-weight: 500; }
  .clock .who { display: block; font-size: 13px; color: var(--haze); font-weight: 400; }
  .clock .t { font-family: var(--display); font-size: 24px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .clock .d { display: block; font-family: var(--body); font-size: 12px; color: var(--haze); font-weight: 400; }
  .clock.cn .place, .clock.cn .t { color: var(--lantern); }
  .diff { font-size: 13px; color: var(--haze); margin-top: 10px; }

  .stop { position: relative; padding: 0 0 22px 22px; border-left: 2px solid var(--ink-3); margin-left: 6px; }
  .stop::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--haze); }
  .stop.first::before { background: var(--lantern); border-color: var(--lantern); }
  .stop .date { font-size: 13px; color: var(--haze); }
  .stop h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin-top: 1px; }
  .stop p { color: #cfd6e0; font-size: 15px; margin-top: 3px; }
  .stop.tbd h3 { color: var(--haze); font-weight: 400; font-style: italic; }
  .tline { margin-top: 18px; }

  .crew { margin-top: 14px; display: grid; gap: 10px; }
  .couple { background: var(--ink-2); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
  .couple .fl { flex-basis: 100%; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; color: #cfd6e0; }
  .couple .fl div + div { margin-top: 4px; }
  .couple b { font-family: var(--display); font-weight: 600; font-size: 18px; }
  .couple span { color: var(--haze); font-size: 14px; }

  /* Weather */
  .chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .chip { background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 700; }
  .wnow { margin-top: 18px; background: linear-gradient(160deg, var(--ink-3), var(--ink-2)); border-radius: 18px; padding: 20px; }
  .wnow .temp { font-family: var(--display); font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: -.03em; }
  .wnow .temp small { font-size: 26px; font-weight: 600; color: var(--haze); letter-spacing: 0; }
  .wnow .cond { font-size: 18px; font-family: var(--display); font-weight: 600; margin-top: 4px; }
  .wnow .meta { color: var(--haze); font-size: 14px; margin-top: 6px; }
  .fc { margin-top: 18px; border-top: 1px solid var(--line); }
  .fcrow { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 15px; }
  .fcrow .c { color: #cfd6e0; }
  .fcrow .hl { font-variant-numeric: tabular-nums; text-align: right; }
  .fcrow .hl i { font-style: normal; color: var(--haze); }
  .note { margin-top: 16px; font-size: 14px; color: var(--haze); }

  /* Map */
  #map { position: relative; z-index: 0; isolation: isolate; height: 52vh; min-height: 320px; margin-top: 14px; border-radius: 16px; overflow: hidden; background: var(--ink-2); }
  .pin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .pin.tbd { background: transparent !important; border: 3px dashed #fff; width: 22px; height: 22px; }
  .leaflet-popup-content-wrapper { background: var(--paper); color: var(--ink); border-radius: 12px; }
  .leaflet-popup-tip { background: var(--paper); }
  .leaflet-popup-content { font-family: var(--body); font-size: 14px; line-height: 1.4; margin: 12px 14px; }
  .pop b { font-family: var(--display); font-size: 16px; font-weight: 600; display: block; }
  .pop .zh { font-family: var(--han); font-weight: 600; font-size: 15px; margin-top: 2px; }
  .pop .ad { color: #4a5568; margin-top: 4px; }
  .pop .ap { color: #b3341f; margin-top: 4px; font-size: 13px; }
  .pop .acts { display: flex; gap: 8px; margin-top: 10px; }
  .pop .acts a, .pop .acts button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 10px; border: 0; background: var(--ink); color: var(--paper); text-decoration: none; cursor: pointer; }
  .legend { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .plist { margin-top: 14px; border-top: 1px solid var(--line); }
  .prow { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; cursor: pointer; }
  .prow b { font-weight: 500; display: block; }
  .prow span { font-size: 13px; color: var(--haze); }
  .empty { padding: 26px 0; color: var(--haze); }
  .err { color: #ff9b8f; font-size: 14px; margin-top: 10px; }

  /* Guide */
  .gsub { margin-top: 26px; }
  .phr { margin-top: 12px; border-top: 1px solid var(--line); }
  .ph { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .ph .say { font-family: var(--display); font-weight: 600; font-size: 19px; margin-top: 2px; }
  .ph .py { font-size: 13px; color: var(--haze); margin-top: 1px; }
  .ph .zh { font-family: var(--han); font-weight: 600; font-size: 20px; text-align: right; }
  .chk { margin-top: 12px; }
  .chk label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .chk input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--jade); flex: none; }
  .chk b { font-weight: 500; display: block; }
  .chk span { font-size: 14px; color: var(--haze); }
  .chk input:checked + div b { text-decoration: line-through; color: var(--haze); }

  /* Full-screen driver card */
  .show { position: fixed; inset: 0; background: var(--paper); color: var(--ink); z-index: 50; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; }
  .show.on { display: flex; }
  .show .zh { font-family: var(--han); font-weight: 900; font-size: clamp(40px, 12vw, 64px); line-height: 1.25; }
  .show .en { margin-top: 20px; font-size: 18px; color: #4a5568; }
  .show .py { margin-top: 6px; font-size: 15px; color: #6b7686; }
  .show .x { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); font-size: 14px; color: #6b7686; }

  /* Tabs */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(14,20,36,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav .in { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; margin: 0 auto; }
  nav button { height: var(--tabh); background: none; border: 0; color: var(--haze); font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
  nav button .g { font-family: var(--han); font-weight: 900; font-size: 22px; line-height: 1; }
  nav button.on { color: var(--paper); }
  nav button.on .g { color: var(--lantern); }
  :focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .moon { animation: drift 40s ease-in-out infinite alternate; } }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(14px); } }
</style>
</head>
<body>

<!-- TRIP -->
<main id="v-trip" class="view on">
  <header class="hero" id="hero">
    <div class="moon"></div>
    <div class="wrap">
      <p class="kicker">China 2026</p>
      <div class="bignum"><div class="days" id="days">--</div><div class="han">天</div></div>
      <p class="under" id="under">until we meet in Shanghai</p>
      <p class="when" id="when"></p>
      <div class="hms" id="hms"></div>
    </div>
    <svg class="skyline" viewBox="0 0 400 130" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g fill="#0a0f1d">
        <rect x="0" y="86" width="26" height="44"/><rect x="22" y="70" width="20" height="60"/>
        <rect x="46" y="94" width="30" height="36"/><rect x="72" y="58" width="16" height="72"/>
        <rect x="92" y="80" width="24" height="50"/><rect x="118" y="48" width="14" height="82"/>
        <rect x="134" y="76" width="26" height="54"/>
        <rect x="190" y="30" width="5" height="100"/>
        <circle cx="192.5" cy="40" r="9"/><circle cx="192.5" cy="72" r="14"/>
        <rect x="190" y="14" width="1.5" height="20"/>
        <rect x="224" y="62" width="22" height="68"/><rect x="248" y="22" width="18" height="108"/>
        <rect x="268" y="44" width="22" height="86"/><rect x="292" y="84" width="26" height="46"/>
        <rect x="320" y="56" width="16" height="74"/><rect x="338" y="90" width="28" height="40"/>
        <rect x="366" y="68" width="34" height="62"/>
      </g>
      <g fill="#E0402F" opacity=".75"><circle cx="192.5" cy="40" r="3"/><circle cx="192.5" cy="72" r="5"/></g>
    </svg>
  </header>

  <div class="wrap">
    <section class="blk">
      <h2>What time is it there</h2>
      <div class="clocks" id="clocks"></div>
      <p class="diff" id="diff"></p>
    </section>

    <section class="blk">
      <h2>The crew</h2>
      <div class="crew" id="crew"></div>
    </section>
  </div>
</main>

<!-- ITINERARY -->
<main id="v-itin" class="view">
  <div class="wrap" style="padding-top: calc(env(safe-area-inset-top, 0px) + 28px)">
    <h2>Itinerary</h2>
    <p class="sub">Updated as the host sends details</p>
    <div class="tline" id="itin"></div>
  </div>
</main>

<!-- WEATHER -->
<main id="v-weather" class="view">
  <div class="wrap" style="padding-top: calc(env(safe-area-inset-top, 0px) + 28px)">
    <h2>Weather</h2>
    <p class="sub" id="wsub">Live conditions</p>
    <div class="chips" id="cities"></div>
    <div id="wbody"><p class="empty">Loading weather</p></div>
  </div>
</main>

<!-- MAP -->
<main id="v-map" class="view">
  <div class="wrap" style="padding-top: calc(env(safe-area-inset-top, 0px) + 28px)">
    <h2>Map</h2>
    <p class="sub">Hotels, factories, airports, and stations. Tap a pin for details.</p>
    <div class="chips" id="mapfilters"></div>
    <div id="map"></div>
    <p class="err" id="maperr" hidden></p>
    <div class="plist" id="plist"></div>
  </div>
</main>

<!-- GUIDE -->
<main id="v-guide" class="view">
  <div class="wrap" style="padding-top: calc(env(safe-area-inset-top, 0px) + 28px)">
    <h2>Guide</h2>

    <div class="gsub">
      <h2 style="font-size:21px">Before we go</h2>
      <div class="chk" id="chk"></div>
    </div>

    <div class="gsub">
      <h2 style="font-size:21px">Useful phrases</h2>
      <div class="phr" id="phr"></div>
    </div>
  </div>
</main>

<div class="show" id="show" role="dialog" aria-modal="true">
  <div class="zh" id="show-zh"></div>
  <div class="en" id="show-en"></div>
  <div class="py" id="show-py"></div>
  <div class="x">Tap anywhere to close</div>
</div>

<nav aria-label="Sections">
  <div class="in">
    <button data-v="trip" class="on"><span class="g">行</span>Trip</button>
    <button data-v="itin"><span class="g">程</span>Itinerary</button>
    <button data-v="weather"><span class="g">天</span>Weather</button>
    <button data-v="map"><span class="g">图</span>Map</button>
    <button data-v="guide"><span class="g">指</span>Guide</button>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

const PHRASES = [
  // English, pinyin, Chinese, how to say it
  ['Hello', 'Nǐ hǎo', '你好', 'Knee How'],
  ['Thank you', 'Xièxie', '谢谢', 'Shyeh Shyeh'],
  ['Excuse me / May I ask', 'Qǐngwèn', '请问', 'Ching Wun'],

const CHECKLIST = [
  ['Confirm entry requirements with the host', 'Passport validity and any visa or entry paperwork. Ask the host company what they need from you.'],
  ['Set up a VPN before you leave', 'Many Western apps and sites are blocked in mainland China. Install and test it at home.'],
  ['Get International Data Plan or an eSIM', 'Set it up before you leave so you have data when you land.'],

];
/* ============ END EDIT ============ */

const $ = (s) => document.querySelector(s);
const target = new Date(TRIP.target);
const SH = 'Asia/Shanghai';

/* ---------- Tabs ---------- */
function show(v) {
  document.querySelectorAll('.view').forEach((el) => el.classList.toggle('on', el.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  window.scrollTo(0, 0);
  if (v === 'weather') loadWeather();
  if (v === 'map') showMap();
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => show(b.dataset.v)));

/* ---------- Time helpers ---------- */
function offsetMin(tz, date) {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }).formatToParts(date);
  const g = (t) => +p.find((x) => x.type === t).value;
  return (Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second')) - Math.floor(date.getTime() / 1000) * 1000) / 60000;
}
const fmtTime = (d, tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(d);
const fmtDay = (d, tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', month: 'short', day: 'numeric' }).format(d);

/* ---------- Countdown ---------- */
function tickCountdown() {
  const now = new Date();
  let ms = target - now;
  // Within 5 hours of the meetup (and after), drop the countdown and show only the time zone info.
  const quiet = ms <= HIDE_COUNTDOWN_HOURS * 3600000;
  $('#hero').classList.toggle('nocount', quiet);
  if (quiet) return;
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  $('#days').textContent = d;
  $('#under').textContent = d === 1 ? 'day until we meet in Shanghai' : 'days until we meet in Shanghai';
  $('#hms').innerHTML = [[h, 'hours'], [m, 'minutes'], [sec, 'seconds']].map(([n, l]) => '<div>' + String(n).padStart(2, '0') + '<span>' + l + '</span></div>').join('');
}
$('#when').textContent = new Intl.DateTimeFormat('en-US', { timeZone: SH, weekday: 'long', month: 'long', day: 'numeric' }).format(target) + ', ' + TRIP.meetLabel;

/* ---------- Clocks ---------- */
function renderClocks() {
  const now = new Date();
  const rows = [{ place: 'Shanghai', who: 'China time', tz: SH, cn: true }].concat(
    CLOCK_ORDER.map((id) => CREW.find((c) => c.id === id)).map((c) => ({ place: c.from, who: c.names, tz: c.tz })));
  $('#clocks').innerHTML = rows.map((r) => '<div class="clock' + (r.cn ? ' cn' : '') + '"><div class="place">' + r.place + '<span class="who">' + r.who + '</span></div><div class="t">' + fmtTime(now, r.tz) + '<span class="d">' + fmtDay(now, r.tz) + '</span></div></div>').join('');
}
function renderDiff() {
  const shOff = offsetMin(SH, target);
  const parts = CLOCK_ORDER.map((id) => CREW.find((c) => c.id === id)).map((c) => {
    const h = (shOff - offsetMin(c.tz, target)) / 60;
    return c.from + ' ' + h + ' hours';
  });
  $('#diff').textContent = 'On Dec 5, Shanghai is ahead of ' + parts.join(', ') + '.';
}

/* ---------- Itinerary and crew ---------- */
function renderItin() {
  $('#itin').innerHTML = ITINERARY.map((s, i) => {
    if (s.tbd) return '<div class="stop tbd"><h3>' + s.title + '</h3><p>' + (s.note || '') + '</p></div>';
    const d = new Date(s.date + 'T12:00:00+08:00');
    const label = new Intl.DateTimeFormat('en-US', { timeZone: SH, weekday: 'long', month: 'long', day: 'numeric' }).format(d) + (s.time ? ', ' + s.time : '');
    return '<div class="stop' + (i === 0 ? ' first' : '') + '"><div class="date">' + label + '</div><h3>' + s.title + '</h3>' + (s.note ? '<p>' + s.note + '</p>' : '') + '</div>';
  }).join('');
}
function renderCrew() {
  $('#crew').innerHTML = CREW.map((c) => '<div class="couple"><b>' + c.names + '</b><span>' + c.from + '</span>' +
    (c.flights ? '<div class="fl">' + c.flights.map((f) => '<div>' + f + '</div>').join('') + '</div>' : '') + '</div>').join('');
}

/* ---------- Weather ---------- */
const WX = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Freezing fog', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains', 80: 'Rain showers', 81: 'Rain showers', 82: 'Heavy showers', 85: 'Snow showers', 86: 'Snow showers', 95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Thunderstorm with hail' };
let cityIdx = 0, wxLoaded = {};
function renderCities() {
  $('#cities').innerHTML = CITIES.length > 1 ? CITIES.map((c, i) => '<button class="chip' + (i === cityIdx ? ' on' : '') + '" data-i="' + i + '">' + c.name + '</button>').join('') : '';
  document.querySelectorAll('#cities .chip').forEach((b) => b.addEventListener('click', () => { cityIdx = +b.dataset.i; renderCities(); loadWeather(true); }));
}
const toC = (f) => Math.round((f - 32) * 5 / 9);
async function loadWeather(force) {
  const c = CITIES[cityIdx];
  const body = $('#wbody');
  const cached = wxLoaded[c.name];
  if (cached && !force && Date.now() - cached.t < 10 * 60 * 1000) return paintWeather(c, cached.j);
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=' + encodeURIComponent(c.tz) + '&forecast_days=7';
    const r = await fetch(url);
    if (!r.ok) throw new Error('bad status');
    const j = await r.json();
    wxLoaded[c.name] = { t: Date.now(), j };
    paintWeather(c, j);
  } catch (e) {
    body.innerHTML = '<p class="empty">Could not load the weather. Check your connection and switch tabs to try again.</p>';
  }
}
function paintWeather(c, j) {
  const cu = j.current, d = j.daily;
  const t = Math.round(cu.temperature_2m);
  let h = '<div class="wnow"><div class="temp">' + t + '°<small>F · ' + toC(cu.temperature_2m) + '°C</small></div>' +
    '<div class="cond">' + (WX[cu.weather_code] || 'Conditions unavailable') + '</div>' +
    '<div class="meta">Feels like ' + Math.round(cu.apparent_temperature) + '°F · Humidity ' + Math.round(cu.relative_humidity_2m) + '% · Wind ' + Math.round(cu.wind_speed_10m) + ' mph</div></div>';
  h += '<div class="fc">' + d.time.map((day, i) => {
    const lbl = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'numeric', day: 'numeric' }).format(new Date(day + 'T12:00:00Z'));
    return '<div class="fcrow"><div>' + lbl + '</div><div class="c">' + (WX[d.weather_code[i]] || '') + (d.precipitation_probability_max[i] != null ? ' · ' + d.precipitation_probability_max[i] + '% rain' : '') + '</div><div class="hl">' + Math.round(d.temperature_2m_max[i]) + '° <i>/ ' + Math.round(d.temperature_2m_min[i]) + '°</i></div></div>';
  }).join('') + '</div>';
  h += '<p class="note">This is the current forecast for ' + c.name + '. A forecast for Dec 5 shows up here once it is about two weeks away. December there is usually cold and damp, so plan for layers.</p>';
  $('#wbody').innerHTML = h;
  $('#wsub').textContent = c.name + ' right now';
}

/* ---------- Map ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const TYPES = {
  hotel:   { label: 'Hotels',    color: '#E0402F' },
  factory: { label: 'Factories', color: '#5FB89A' },
  airport: { label: 'Airports',  color: '#6FA8DC' },
  transit: { label: 'Trains',    color: '#E8B04A' },
  tbd:     { label: 'Area only', color: '#8FA3B8' }
};
let map = null, mapReady = false, mapFilter = 'all';
const markers = [];

function mapsLink(p) {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  return ios ? 'https://maps.apple.com/?ll=' + p.lat + ',' + p.lon + '&q=' + encodeURIComponent(p.en)
             : 'geo:' + p.lat + ',' + p.lon + '?q=' + p.lat + ',' + p.lon + '(' + encodeURIComponent(p.en) + ')';
}
function popupFor(p, i) {
  const d = document.createElement('div');
  d.className = 'pop';
  d.innerHTML = '<b>' + esc(p.en) + '</b>' + (p.zh ? '<div class="zh">' + esc(p.zh) + '</div>' : '') +
    (p.addr ? '<div class="ad">' + esc(p.addr) + '</div>' : '') +
    (p.when ? '<div class="ad">' + esc(p.when) + '</div>' : '') +
    (p.approx ? '<div class="ap">Pin is approximate. Exact spot to come.</div>' : '') +
    '<div class="acts">' + (p.zh ? '<button type="button" data-show="' + i + '">Show driver</button>' : '') +
    '<a href="' + mapsLink(p) + '">Open in Maps</a></div>';
  const b = d.querySelector('[data-show]');
  if (b) b.addEventListener('click', () => openShow(p.zh + (p.addrZh ? '<br><span style="font-size:.55em;font-weight:600">' + esc(p.addrZh) + '</span>' : ''), p.en, p.py));
  return d;
}
function renderMapFilters() {
  const keys = ['all'].concat(Object.keys(TYPES).filter((k) => PLACES.some((p) => p.type === k)));
  $('#mapfilters').innerHTML = keys.map((k) => '<button class="chip' + (k === mapFilter ? ' on' : '') + '" data-k="' + k + '">' +
    (k === 'all' ? 'All' : '<span class="legend" style="background:' + TYPES[k].color + '"></span>' + TYPES[k].label) + '</button>').join('');
  document.querySelectorAll('#mapfilters .chip').forEach((b) => b.addEventListener('click', () => { mapFilter = b.dataset.k; renderMapFilters(); applyMapFilter(true); }));
}
function applyMapFilter(fit) {
  const vis = [];
  markers.forEach((m) => {
    const on = mapFilter === 'all' || m.p.type === mapFilter;
    if (on) { m.marker.addTo(map); vis.push([m.p.lat, m.p.lon]); } else { map.removeLayer(m.marker); }
  });
  $('#plist').innerHTML = PLACES.map((p, i) => ({ p, i })).filter((x) => mapFilter === 'all' || x.p.type === mapFilter).map((x) =>
    '<button class="prow" data-i="' + x.i + '"><b>' + esc(x.p.en) + '</b><span>' + esc(x.p.when || TYPES[x.p.type].label) + '</span></button>').join('');
  document.querySelectorAll('.prow').forEach((b) => b.addEventListener('click', () => {
    const m = markers[+b.dataset.i];
    document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (mapFilter !== 'all' && m.p.type !== mapFilter) return;
    map.flyTo([m.p.lat, m.p.lon], 12, { duration: 0.8 });
    setTimeout(() => m.marker.openPopup(), 850);
  }));
  if (fit && vis.length) map.fitBounds(vis, { padding: [40, 40], maxZoom: 11 });
}
function showMap() {
  if (typeof L === 'undefined') {
    const e = $('#maperr'); e.hidden = false;
    e.textContent = 'The map could not load. Check your connection and switch tabs to try again.';
    return;
  }
  $('#maperr').hidden = true;
  if (!mapReady) {
    mapReady = true;
    map = L.map('map', { zoomControl: true, attributionControl: true }).setView([30.5, 118], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    PLACES.forEach((p, i) => {
      const icon = L.divIcon({ className: '', html: '<div class="pin' + (p.type === 'tbd' ? ' tbd' : '') + '" style="background:' + TYPES[p.type].color + '"></div>', iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -10] });
      const marker = L.marker([p.lat, p.lon], { icon, title: p.en }).bindPopup(() => popupFor(p, i));
      markers.push({ p, marker });
    });
    renderMapFilters();
    applyMapFilter(true);
  }
  setTimeout(() => map.invalidateSize(), 50);
}

/* ---------- Guide ---------- */
function openShow(zh, en, py) {
  $('#show-zh').innerHTML = zh; $('#show-en').textContent = en; $('#show-py').textContent = py || '';
  $('#show').classList.add('on');
}
$('#show').addEventListener('click', () => $('#show').classList.remove('on'));
function renderGuide() {
  $('#phr').innerHTML = PHRASES.map((p) => '<div class="ph"><div><div>' + p[0] + '</div><div class="say">' + p[3] + '</div><div class="py">' + p[1] + '</div></div><div class="zh">' + p[2] + '</div></div>').join('');

  let done = {};
  try { done = JSON.parse(localStorage.getItem('china-chk') || '{}'); } catch (e) {}
  $('#chk').innerHTML = CHECKLIST.map((c, i) => '<label><input type="checkbox" data-k="' + i + '"' + (done[i] ? ' checked' : '') + '><div><b>' + c[0] + '</b><span>' + c[1] + '</span></div></label>').join('');
  document.querySelectorAll('#chk input').forEach((cb) => cb.addEventListener('change', () => {
    done[cb.dataset.k] = cb.checked;
    try { localStorage.setItem('china-chk', JSON.stringify(done)); } catch (e) {}
  }));
}

/* ---------- Boot ---------- */
renderItin(); renderCrew(); renderDiff(); renderClocks(); renderCities(); renderGuide();
tickCountdown();
setInterval(tickCountdown, 1000);
setInterval(renderClocks, 15000);
</script>
